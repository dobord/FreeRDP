groups:
  - name: frdpd
    rules:
      - alert: FRDPSessionManagerDown
        expr: frdp_sesmand_reachable == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "frdp-sesmand is unreachable"
          description: "frdpctl cannot reach frdp-sesmand on {{ $labels.socket }}."

      - alert: FRDPTextfileScrapeFailed
        expr: frdp_exporter_scrape_success == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "FRDP textfile scrape failed"
          description: "The FRDP node_exporter textfile collector could not parse a healthy frdpctl status response for {{ $labels.socket }}."

      - alert: FRDPSessionDetailScrapeFailed
        expr: frdp_sessions_detail_scrape_success == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "FRDP per-session detail scrape failed"
          description: "The FRDP node_exporter textfile collector could not scrape per-session details for {{ $labels.socket }}."

      - alert: FRDPTextfileCollectorStale
        expr: time() - frdp_exporter_last_scrape_timestamp_seconds > 300
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "FRDP textfile collector is stale"
          description: "The FRDP node_exporter textfile collector has not refreshed metrics for {{ $labels.socket }} in more than five minutes."

      - alert: FRDPSessionCapacityHigh
        expr: frdp_sessions_utilization_ratio > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "FRDP session capacity is high"
          description: "Managed FRDP sessions are above 90% of the configured session.max_sessions admission limit for {{ $labels.socket }}."

      - alert: FRDPSessionCleanupStuck
        expr: frdp_sessions_state{state=~"stopping|dead"} > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "FRDP sessions are stuck in cleanup states"
          description: "One or more FRDP sessions for {{ $labels.socket }} have remained in {{ $labels.state }} state for more than ten minutes."
