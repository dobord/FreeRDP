Section "ServerFlags"
    Option "AutoAddDevices" "false"
    Option "AllowMouseOpenFail" "true"
    Option "DontVTSwitch" "true"
EndSection

Section "Device"
    Identifier "FRDPDummyDevice"
    Driver "dummy"
    VideoRam 262144
EndSection

Section "Monitor"
    Identifier "FRDPDummyMonitor"
    HorizSync 5.0-1000.0
    VertRefresh 5.0-200.0
    Modeline "800x600" 40.00 800 840 968 1056 600 601 605 628 +HSync +VSync
    Modeline "1024x768" 65.00 1024 1048 1184 1344 768 771 777 806 -HSync -VSync
    Modeline "1280x720" 74.50 1280 1344 1472 1664 720 723 728 748 -HSync +VSync
EndSection

Section "Screen"
    Identifier "FRDPDummyScreen"
    Device "FRDPDummyDevice"
    Monitor "FRDPDummyMonitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1024x768" "800x600" "1280x720"
        Virtual 8192 8192
    EndSubSection
EndSection

Section "ServerLayout"
    Identifier "FRDPDummyLayout"
    Screen "FRDPDummyScreen"
EndSection
