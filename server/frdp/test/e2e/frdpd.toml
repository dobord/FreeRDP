[server]
listen = "0.0.0.0:3389"
security = "nla"
tls_cert = "/etc/frdpd/tls.crt"
tls_key = "/etc/frdpd/tls.key"
max_connections = 8

[auth]
mode = "pam-sssd"
pam_service = "frdpd"
auth_socket = "/run/frdp-authd/authd.sock"
ntlm_fallback = true
ntlm_sam_file = "/etc/frdpd/ntlm.sam"

[session]
session_socket = "/run/frdp-sesmand/sesmand.sock"

[channels]
static_mode = "blocklist"
static_deny = ""
dynamic_mode = "blocklist"
dynamic_deny = ""

[clipboard]
mode = "text"
direction = "bidirectional"
max_text_bytes = 65536
