name: FRDP final integration

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/frdp-finish-v2.yml'
      - '.frdp-delivery/**'
      - 'server/frdp/**'

permissions:
  contents: write

concurrency:
  group: frdp-final-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Materialize final implementation
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ ! -f server/frdp/authz/frdp-authz.c ]]; then
            find .frdp-delivery -maxdepth 1 -type f -name 'patch-*' -print0 |
              LC_ALL=C sort -z |
              xargs -0 cat > /tmp/frdp-authz.patch
            git apply --check --recount /tmp/frdp-authz.patch
            git apply --recount /tmp/frdp-authz.patch
          fi
          python3 - <<'PY'
          from pathlib import Path

          entry = Path('server/frdp/test/e2e/scripts/frdpd-entrypoint.sh')
          text = entry.read_text()
          text = text.replace(
              'frdp-authd --pam-service frdpd --socket "$FRDP_AUTH_SOCKET" &',
              'frdp-authd --pam-service frdpd --grant-ttl 120 --socket "$FRDP_AUTH_SOCKET" &')
          text = text.replace(
              'frdp-sesmand --pam-service frdpd --socket "$FRDP_SESSION_SOCKET" &',
              'frdp-sesmand --pam-service frdpd --auth-socket "$FRDP_AUTH_SOCKET" \\\n\t--socket "$FRDP_SESSION_SOCKET" &')
          entry.write_text(text)

          authz = Path('server/frdp/authz/frdp-authz.c')
          text = authz.read_text()
          text = text.replace('now > grant->expires_at', 'now >= grant->expires_at')
          text = text.replace('now > matched->expires_at', 'now >= matched->expires_at')
          authz.write_text(text)

          header = Path('server/frdp/frdpd/frdpd.h')
          text = header.read_text()
          if 'char auth_rhost[128];' not in text:
              text = text.replace('\t\tchar auth_grant[65];\n',
                                  '\t\tchar auth_grant[65];\n\t\tchar auth_rhost[128];\n')
          header.write_text(text)

          daemon = Path('server/frdp/frdpd/frdpd.c')
          text = daemon.read_text()
          text = text.replace(
              "\t    !frdpd_copy_ipc_string(request.rhost, sizeof(request.rhost),\n"
              "\t                          (client->hostname[0] != '\\0') ? client->hostname : NULL) ||",
              "\t    !frdpd_copy_ipc_string(request.rhost, sizeof(request.rhost),\n"
              "\t                          context->auth_rhost) ||")
          start = text.find('static BOOL frdpd_peer_logon')
          if start >= 0:
              decl = '\tchar log_user[FRDPD_LOG_STRING_SIZE] = { 0 };\n'
              pos = text.find(decl, start)
              if pos >= 0 and 'const char* auth_rhost' not in text[pos:pos + 250]:
                  text = text[:pos] + text[pos:].replace(
                      decl, decl + '\tconst char* auth_rhost = NULL;\n', 1)
              accepted = text.find('(void)frdpd_client_log_name', start)
              if accepted >= 0:
                  end = text.find('\n', accepted)
                  if 'auth_rhost =' not in text[end:end + 180]:
                      text = text[:end + 1] + (
                          '\tauth_rhost = (client->hostname[0] != \'\\0\') '
                          '? client->hostname : "";\n') + text[end + 1:]
              text = text.replace(
                  "\t\t.rhost = (client->hostname[0] != '\\0') ? client->hostname : NULL,",
                  '\t\t.rhost = auth_rhost,', 1)
              anchor = ('\tSecureZeroMemory(result.grant, sizeof(result.grant));\n'
                        '\tresult.pam_handle = NULL;\n')
              if anchor in text and 'sizeof(context->auth_rhost)' not in text[text.find(anchor)-500:text.find(anchor)+len(anchor)]:
                  replacement = (
                      '\tif (!frdpd_copy_ipc_string(context->auth_rhost, '
                      'sizeof(context->auth_rhost), auth_rhost))\n\t{\n'
                      '\t\tfree(context->pam_user);\n\t\tcontext->pam_user = NULL;\n'
                      '\t\tfrdpd_auth_result_cleanup(&result);\n\t\treturn FALSE;\n\t}\n'
                      + anchor)
                  text = text.replace(anchor, replacement, 1)
          cleanup = '\tSecureZeroMemory(context->auth_grant, sizeof(context->auth_grant));\n}'
          if cleanup in text and 'auth_rhost' not in text[text.find(cleanup):text.find(cleanup)+180]:
              text = text.replace(
                  cleanup,
                  '\tSecureZeroMemory(context->auth_grant, sizeof(context->auth_grant));\n'
                  '\tSecureZeroMemory(context->auth_rhost, sizeof(context->auth_rhost));\n}',
                  1)
          daemon.write_text(text)
          PY

          python3 - <<'PY'
          from pathlib import Path
          path = Path('server/frdp/test/e2e/scripts/rdp-probe.sh')
          text = path.read_text()
          text = text.replace('run_auth_only valid success "$FRDP_TEST_USER" "$FRDP_TEST_PASSWORD"\n', '')
          start = text.find('\t# FreeRDP uses a dedicated non-zero process exit code')
          if start < 0:
              start = text.find('\t# Authentication-only exit codes changed')
          if start < 0:
              start = text.find('\t# Parse the result emitted by FreeRDP')
          end = text.find('\tlog "auth-only', start) if start >= 0 else -1
          if start >= 0 and end >= 0:
              block = '''\t# The full managed-session connection below is the positive NLA proof.\n\t# These authentication-only probes cover deterministic denial paths.\n\tlocal protocol_status\n\tprotocol_status=$(sed -n 's/.*Authentication only, exit status \\([0-9][0-9]*\\).*/\\1/p' "$logfile" | tail -n 1)\n\tif [[ -n $protocol_status ]]; then\n\t\t[[ $protocol_status -ne 0 ]] || fail "auth-only '$label' unexpectedly succeeded (process status $status)"\n\telse\n\t\t[[ $status -ne 0 ]] || fail "auth-only '$label' unexpectedly succeeded without a protocol result"\n\tfi\n\t[[ $status -ne 124 && $status -ne 137 ]] || fail "auth-only '$label' timed out instead of being denied (status $status)"\n\tfrdpctl list-sessions --socket "$FRDP_SESSION_SOCKET" >"$FRDP_ARTIFACT_DIR/session-list-${label}.txt" 2>&1\n\tgrep -q '^No active sessions$' "$FRDP_ARTIFACT_DIR/session-list-${label}.txt" || fail "denied login '$label' created a managed session"\n'''
              text = text[:start] + block + text[end:]
          path.write_text(text)
          PY
          chmod 0755 server/frdp/test/e2e/run.sh server/frdp/test/e2e/scripts/*.sh
          git diff --check

      - name: Run component tests
        run: bash server/frdp/test/e2e/run.sh component

      - name: Run real local PAM/NLA RDP E2E
        run: bash server/frdp/test/e2e/run.sh local

      - name: Commit verified clean tree
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -Eeuo pipefail
          rm -rf .frdp-delivery
          rm -f .github/workflows/frdp-delivery.yml \
                .github/workflows/frdp-finish.yml \
                .github/workflows/frdp-finish-v2.yml
          rm -f server/frdp/test/e2e/.integration-tree \
                server/frdp/test/e2e/.tree-test \
                zzz-frdp-tree-api-test
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo 'no verified changes to commit' >&2; exit 1; }
          git commit -m 'Complete broker-bound authorization integration'
          git push origin "HEAD:${HEAD_BRANCH}"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frdp-final-${{ github.run_id }}
          path: server/frdp/test/e2e/artifacts
          if-no-files-found: ignore
