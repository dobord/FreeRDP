name: FRDP authorization delivery

on:
  pull_request:
    branches: [master]
    paths:
      - '.frdp-delivery/**'
      - '.github/workflows/frdp-delivery.yml'

permissions:
  contents: write

concurrency:
  group: frdp-delivery-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Apply and commit staged implementation
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -Eeuo pipefail
          mkdir -p server/frdp/test/e2e/artifacts/delivery
          find .frdp-delivery -maxdepth 1 -type f -name 'patch-*' -print0 |
            LC_ALL=C sort -z |
            xargs -0 cat > /tmp/frdp-authz.patch
          sha256sum /tmp/frdp-authz.patch | tee server/frdp/test/e2e/artifacts/delivery/patch.sha256
          git apply --check --verbose --recount /tmp/frdp-authz.patch
          git apply --verbose --recount /tmp/frdp-authz.patch
          rm -rf .frdp-delivery
          rm -f .github/workflows/frdp-delivery.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo 'staged implementation made no changes' >&2; exit 1; }
          git commit -m 'Implement broker-bound authorization grants'
          git push origin "HEAD:${HEAD_BRANCH}"

      - name: Run component tests
        run: bash server/frdp/test/e2e/run.sh component

      - name: Run local PAM RDP E2E
        run: bash server/frdp/test/e2e/run.sh local

      - name: Upload delivery diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frdp-delivery-${{ github.run_id }}
          path: server/frdp/test/e2e/artifacts
          if-no-files-found: ignore
