name: frdpd component and e2e

on:
  pull_request:
    branches: [master]
    paths:
      - 'server/frdp/**'
      - 'tools/frdpctl/**'
      - 'include/freerdp/channels/wtsvc.h'
      - 'libfreerdp/core/server.c'
      - 'libfreerdp/core/server.h'
      - 'cmake/CompilerSanitizerOptions.cmake'
      - '.github/workflows/frdpd-compose.yml'
  push:
    branches: ['project/**']
    paths:
      - 'server/frdp/**'
      - 'tools/frdpctl/**'
      - 'include/freerdp/channels/wtsvc.h'
      - 'libfreerdp/core/server.c'
      - 'libfreerdp/core/server.h'
      - 'cmake/CompilerSanitizerOptions.cmake'
      - '.github/workflows/frdpd-compose.yml'
  schedule:
    - cron: '15 3 * * 0'
  workflow_dispatch:
    inputs:
      profile:
        description: 'Test profile to run'
        required: true
        default: quick
        type: choice
        options:
          - quick
          - component
          - local
          - samba
          - freeipa
          - all

permissions:
  contents: read

concurrency:
  group: frdpd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FRDP_E2E_ARTIFACTS: ${{ github.workspace }}/server/frdp/test/e2e/artifacts

jobs:
  fuzz:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.profile == 'quick' || inputs.profile == 'component' || inputs.profile == 'all'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -q -y
          sudo apt-get install -q -y --no-install-recommends \
            build-essential \
            clang \
            cmake \
            libcjson-dev \
            libicu-dev \
            libkrb5-dev \
            libpam0g-dev \
            libssl-dev \
            libx11-dev \
            libxdamage-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxkbfile-dev \
            libxrandr-dev \
            libxrender-dev \
            libxtst-dev \
            ninja-build \
            pkg-config \
            uuid-dev \
            xvfb \
            zlib1g-dev

      - name: Configure focused FRDP fuzzer build
        run: |
          cmake -S . -B build-frdp-fuzz -GNinja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DBUILD_FUZZERS=ON \
            -DWITH_FRDPD=ON \
            -DWITH_SERVER=ON \
            -DWITH_SHADOW=OFF \
            -DWITH_PROXY=OFF \
            -DWITH_SAMPLE=OFF \
            -DWITH_MANPAGES=OFF \
            -DWITH_WAYLAND=OFF \
            -DWITH_SDL=OFF \
            -DWITH_PULSE=OFF \
            -DWITH_ALSA=OFF \
            -DWITH_CUPS=OFF \
            -DWITH_PCSC=OFF \
            -DWITH_FFMPEG=OFF \
            -DWITH_SWSCALE=OFF \
            -DWITH_FUSE=OFF \
            -DWITH_OPENCL=OFF \
            -DCHANNEL_URBDRC=OFF

      - name: Build focused FRDP fuzzers
        run: cmake --build build-frdp-fuzz --target TestFuzzFreeRDPFrdpConfig TestFuzzFreeRDPFrdpAuthToken

      - name: Run focused FRDP fuzzer smoke
        run: |
          printf '[channels]\nstatic_mode = "allowlist"\nstatic_allow = "cliprdr,rdpsnd"\ndynamic_mode = "allowlist"\ndynamic_allow = "rdpgfx"\n[clipboard]\nmode = "text"\ndirection = "client-to-server"\nmax_text_bytes = 4096\n' > frdp-fuzz-seed.toml
          printf 'FRDPalice' > frdp-auth-token-fuzz-seed.bin
          build-frdp-fuzz/Testing/TestFuzzFreeRDPFrdpConfig frdp-fuzz-seed.toml -runs=1 -artifact_prefix=build-frdp-fuzz/
          build-frdp-fuzz/Testing/TestFuzzFreeRDPFrdpConfig -runs=32 -max_len=1024 -artifact_prefix=build-frdp-fuzz/
          build-frdp-fuzz/Testing/TestFuzzFreeRDPFrdpAuthToken frdp-auth-token-fuzz-seed.bin -runs=1 -artifact_prefix=build-frdp-fuzz/
          build-frdp-fuzz/Testing/TestFuzzFreeRDPFrdpAuthToken -runs=32 -max_len=512 -artifact_prefix=build-frdp-fuzz/

      - name: Upload fuzzer build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frdpd-fuzz-${{ github.run_id }}
          path: |
            build-frdp-fuzz/CMakeFiles/CMakeOutput.log
            build-frdp-fuzz/CMakeFiles/CMakeError.log
            build-frdp-fuzz/crash-*
            build-frdp-fuzz/leak-*
            build-frdp-fuzz/oom-*
            build-frdp-fuzz/timeout-*
            frdp-fuzz-seed.toml
            frdp-auth-token-fuzz-seed.bin
          if-no-files-found: ignore

  warnings:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.profile == 'quick' || inputs.profile == 'component' || inputs.profile == 'all'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -q -y
          sudo apt-get install -q -y --no-install-recommends \
            build-essential \
            clang \
            cmake \
            libcjson-dev \
            libicu-dev \
            libkrb5-dev \
            libpam0g-dev \
            libssl-dev \
            libx11-dev \
            libxdamage-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxkbfile-dev \
            libxrandr-dev \
            libxrender-dev \
            libxtst-dev \
            ninja-build \
            pkg-config \
            uuid-dev \
            xvfb \
            zlib1g-dev

      - name: Configure strict-warning FRDP build
        run: |
          cmake -S . -B build-frdp-warnings -GNinja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=clang \
            -DBUILD_TESTING=ON \
            -DWITH_FRDPD=ON \
            -DWITH_SERVER=ON \
            -DWITH_SHADOW=OFF \
            -DWITH_PROXY=OFF \
            -DWITH_SAMPLE=OFF \
            -DWITH_MANPAGES=OFF \
            -DWITH_WAYLAND=OFF \
            -DWITH_SDL=OFF \
            -DWITH_PULSE=OFF \
            -DWITH_ALSA=OFF \
            -DWITH_CUPS=OFF \
            -DWITH_PCSC=OFF \
            -DWITH_FFMPEG=OFF \
            -DWITH_SWSCALE=OFF \
            -DWITH_FUSE=OFF \
            -DWITH_OPENCL=OFF \
            -DCHANNEL_URBDRC=OFF \
            -DWITH_FRDPD_STRICT_WARNINGS=ON

      - name: Build focused FRDP warning tests
        run: cmake --build build-frdp-warnings --target TestFreeRDPFrdp

      - name: Run focused FRDP warning tests
        run: ctest --test-dir build-frdp-warnings -R '^TestFreeRDPFrdp' --output-on-failure

      - name: Upload warning build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frdpd-warnings-${{ github.run_id }}
          path: |
            build-frdp-warnings/CMakeFiles/CMakeOutput.log
            build-frdp-warnings/CMakeFiles/CMakeError.log
            build-frdp-warnings/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  sanitizer:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.profile == 'quick' || inputs.profile == 'component' || inputs.profile == 'all'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -q -y
          sudo apt-get install -q -y --no-install-recommends \
            build-essential \
            cmake \
            libcjson-dev \
            libicu-dev \
            libkrb5-dev \
            libpam0g-dev \
            libssl-dev \
            libx11-dev \
            libxdamage-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxkbfile-dev \
            libxrandr-dev \
            libxrender-dev \
            libxtst-dev \
            ninja-build \
            pkg-config \
            uuid-dev \
            xvfb \
            zlib1g-dev

      - name: Configure ASan and UBSan FRDP build
        run: |
          cmake -S . -B build-frdp-asan-ubsan -GNinja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DBUILD_TESTING=ON \
            -DWITH_FRDPD=ON \
            -DWITH_SERVER=ON \
            -DWITH_SHADOW=OFF \
            -DWITH_PROXY=OFF \
            -DWITH_SAMPLE=OFF \
            -DWITH_MANPAGES=OFF \
            -DWITH_WAYLAND=OFF \
            -DWITH_SDL=OFF \
            -DWITH_PULSE=OFF \
            -DWITH_ALSA=OFF \
            -DWITH_CUPS=OFF \
            -DWITH_PCSC=OFF \
            -DWITH_FFMPEG=OFF \
            -DWITH_SWSCALE=OFF \
            -DWITH_FUSE=OFF \
            -DWITH_OPENCL=OFF \
            -DCHANNEL_URBDRC=OFF \
            -DWITH_SANITIZE_ADDRESS=ON \
            -DWITH_SANITIZE_UNDEFINED=ON

      - name: Build focused FRDP sanitizer tests
        run: cmake --build build-frdp-asan-ubsan --target TestFreeRDPFrdp

      - name: Run focused FRDP sanitizer tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:allocator_may_return_null=1:log_path=${{ github.workspace }}/build-frdp-asan-ubsan/sanitizer-logs/asan
          LSAN_OPTIONS: print_suppressions=0:log_path=${{ github.workspace }}/build-frdp-asan-ubsan/sanitizer-logs/lsan
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1:log_path=${{ github.workspace }}/build-frdp-asan-ubsan/sanitizer-logs/ubsan
        run: |
          mkdir -p build-frdp-asan-ubsan/sanitizer-logs
          ctest --test-dir build-frdp-asan-ubsan -R '^TestFreeRDPFrdp' --output-on-failure

      - name: Upload sanitizer logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frdpd-sanitizer-${{ github.run_id }}
          path: |
            build-frdp-asan-ubsan/CMakeFiles/CMakeOutput.log
            build-frdp-asan-ubsan/CMakeFiles/CMakeError.log
            build-frdp-asan-ubsan/Testing/Temporary/LastTest.log
            build-frdp-asan-ubsan/sanitizer-logs/*
          if-no-files-found: ignore

  quick:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.profile == 'quick' || inputs.profile == 'component' ||
      inputs.profile == 'local' || inputs.profile == 'all'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Show Docker versions
        run: |
          docker version
          docker compose version

      - name: Run component tests
        if: >-
          github.event_name != 'workflow_dispatch' ||
          inputs.profile == 'quick' || inputs.profile == 'component' || inputs.profile == 'all'
        run: bash server/frdp/test/e2e/run.sh component

      - name: Run local PAM RDP E2E
        if: >-
          github.event_name != 'workflow_dispatch' ||
          inputs.profile == 'quick' || inputs.profile == 'local' || inputs.profile == 'all'
        run: bash server/frdp/test/e2e/run.sh local

      - name: Upload quick-test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frdpd-quick-${{ github.run_id }}
          path: server/frdp/test/e2e/artifacts
          if-no-files-found: ignore

  samba:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.profile == 'samba' || inputs.profile == 'all'))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Run Samba AD, SSSD and RDP E2E
        run: bash server/frdp/test/e2e/run.sh samba

      - name: Upload Samba artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frdpd-samba-${{ github.run_id }}
          path: server/frdp/test/e2e/artifacts/samba
          if-no-files-found: ignore

  freeipa:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.profile == 'freeipa' || inputs.profile == 'all'))
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Show cgroup environment
        run: |
          stat -fc %T /sys/fs/cgroup
          test -e /sys/fs/cgroup/cgroup.controllers
          docker info

      - name: Run FreeIPA, SSSD and RDP E2E
        run: bash server/frdp/test/e2e/run.sh freeipa

      - name: Upload FreeIPA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frdpd-freeipa-${{ github.run_id }}
          path: server/frdp/test/e2e/artifacts/freeipa
          if-no-files-found: ignore
